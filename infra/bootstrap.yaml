AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  claude-ping bootstrap (deploy once, manually, with admin credentials).
  GitHub OIDC trust plus every IAM role, so the CI role never creates IAM resources.

Parameters:
  GitHubOwner:
    Type: String
    Description: GitHub user or org that owns the repository
  GitHubRepo:
    Type: String
    Default: claude-ping
  GitHubEnvironment:
    Type: String
    Default: production
    Description: Only workflow jobs running in this GitHub environment can assume the deploy role
  CreateOidcProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: Set to false if the account already has the token.actions.githubusercontent.com provider
  TokenParameterName:
    Type: String
    Default: /claude-ping/oauth-token
    AllowedPattern: "^/.*"

Conditions:
  CreateOidc: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1]

  # Assumed by GitHub Actions. Deploys the app stack through CfnExecRole and uploads code/layers.
  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: claude-ping-github-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidc
                - !Ref GitHubOidcProvider
                - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOwner}/${GitHubRepo}:environment:${GitHubEnvironment}
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AppStack
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:ListChangeSets
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/claude-ping/*
              - Sid: TemplateInspection
                Effect: Allow
                Action:
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ValidateTemplate
                Resource: "*"
              - Sid: PassCfnExecRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CfnExecRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
              - Sid: FunctionCode
                Effect: Allow
                Action:
                  - lambda:UpdateFunctionCode
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:InvokeFunction
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:claude-ping
              - Sid: CliLayers
                Effect: Allow
                Action:
                  - lambda:PublishLayerVersion
                  - lambda:ListLayerVersions
                  - lambda:GetLayerVersion
                  - lambda:DeleteLayerVersion
                Resource:
                  - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:layer:claude-ping-cli-*
                  - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:layer:claude-ping-cli-*:*

  # Assumed by CloudFormation to create/update the app stack's resources
  CfnExecRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: claude-ping-cfn-exec
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudformation.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: app-stack
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Function
                Effect: Allow
                Action: lambda:*
                Resource:
                  - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:claude-ping
                  - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:claude-ping:*
              - Sid: AttachCliLayers
                Effect: Allow
                Action: lambda:GetLayerVersion
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:layer:claude-ping-cli-*:*
              - Sid: Schedules
                Effect: Allow
                Action: scheduler:*
                Resource:
                  - !Sub arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule-group/claude-ping
                  - !Sub arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/claude-ping/*
              - Sid: LogGroup
                Effect: Allow
                Action: logs:*
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/claude-ping
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/claude-ping:*
              - Sid: DescribeLogGroups
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: "*"
              - Sid: Alerts
                Effect: Allow
                Action:
                  - sns:*
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:DeleteAlarms
                  - cloudwatch:TagResource
                  - cloudwatch:UntagResource
                  - cloudwatch:ListTagsForResource
                Resource:
                  - !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:claude-ping-*
                  - !Sub arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:claude-ping-*
              - Sid: DescribeAlarms
                Effect: Allow
                Action: cloudwatch:DescribeAlarms
                Resource: "*"
              - Sid: PassRuntimeRoles
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt LambdaExecRole.Arn
                  - !GetAtt SchedulerRole.Arn

  # Runtime role of the function: write its own logs, read the OAuth token
  LambdaExecRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: claude-ping-lambda
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/claude-ping:*
              # SecureString uses the AWS managed aws/ssm key, whose key policy already allows decrypt via SSM
              - Sid: Token
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${TokenParameterName}

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: claude-ping-scheduler
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: invoke
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:claude-ping
                  - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:claude-ping:*

Outputs:
  GitHubDeployRoleArn:
    Description: GitHub secret AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt GitHubDeployRole.Arn
  CfnExecRoleArn:
    Description: GitHub secret CFN_EXEC_ROLE_ARN
    Value: !GetAtt CfnExecRole.Arn
  LambdaExecRoleArn:
    Value: !GetAtt LambdaExecRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-LambdaExecRoleArn
  SchedulerRoleArn:
    Value: !GetAtt SchedulerRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-SchedulerRoleArn
  TokenParameterName:
    Value: !Ref TokenParameterName
    Export:
      Name: !Sub ${AWS::StackName}-TokenParameterName
