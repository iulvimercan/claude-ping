name: ci

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Lint
        run: |
          node --check src/index.mjs
          shellcheck scripts/*.sh
          pipx run cfn-lint infra/*.yaml

      - name: Build function
        run: bash scripts/build.sh function

      # Compressing the ~240 MB binary takes a minute or two, so reuse it until the lockfile changes
      - name: Cache CLI layers
        id: cli-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist/cli
          key: cli-${{ hashFiles('package-lock.json', 'scripts/build.sh') }}

      - name: Build CLI layers (checks the Lambda size limits)
        if: steps.cli-cache.outputs.cache-hit != 'true'
        run: |
          command -v zstd || sudo apt-get install -y zstd
          bash scripts/build.sh cli
